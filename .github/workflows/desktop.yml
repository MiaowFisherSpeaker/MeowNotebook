# 桌面客户端:Windows 安装包(.exe)和 macOS 磁盘映像(.dmg,Intel + Apple 芯片通用)
#   推送 tag vX.Y.Z  → 正式版,发布到 Release vX.Y.Z(应用内"检查更新"读它的 latest.json)
#   手动运行(Actions 页面 → 桌面客户端 → Run workflow)→ 开发版,发布到预发布 app-dev(每次覆盖)
# 需要的仓库 Secrets:TAURI_SIGNING_PRIVATE_KEY(更新包签名私钥),TAURI_SIGNING_PRIVATE_KEY_PASSWORD(没设口令就留空)
name: 桌面客户端

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  STABLE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 版本号
        id: v
        run: |
          python3 scripts/release.py --check
          v=$(cat VERSION)
          if [ "$STABLE" = "true" ]; then
            [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} 和 VERSION ($v) 不一致"; exit 1; }
            echo "version=$v" >> "$GITHUB_OUTPUT"
          else
            # 开发版:X.Y.Z-dev.<运行序号>,序号递增,应用内更新才能认出新构建
            echo "version=$v-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: 清掉上一次的开发版
        if: env.STABLE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete app-dev --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: 安装 Tauri CLI
        working-directory: app
        run: npm ci
      - name: 写入版本号
        shell: bash
        run: |
          python3 - "${{ needs.prepare.outputs.version }}" <<'PY'
          import json, sys
          p = "app/src-tauri/tauri.conf.json"
          c = json.load(open(p, encoding="utf-8"))
          c["version"] = sys.argv[1]
          json.dump(c, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npm run tauri --
          args: ${{ matrix.args }} ${{ env.STABLE != 'true' && '--config src-tauri/tauri.dev.conf.json' || '' }}
          tagName: ${{ env.STABLE == 'true' && github.ref_name || 'app-dev' }}
          releaseName: ${{ env.STABLE == 'true' && format('MeowNotebook {0}', github.ref_name) || format('MeowNotebook 开发版 {0}', needs.prepare.outputs.version) }}
          releaseBody: |
            ${{ env.STABLE == 'true' && '正式版。' || '开发版:跟随 main 分支,可能不稳定。和正式版可以同时安装。' }}

            - Windows:下载 `*-setup.exe` 安装。
            - macOS:下载 `.dmg`。没有苹果开发者签名,第一次打开时在"访达"里**右键 → 打开**;提示"已损坏"时在终端运行 `xattr -cr "/Applications/MeowNotebook.app"`。

            服务器端(网站)的更新在网页"设置 → 版本与更新"里,和这里的客户端安装包分开。
          releaseDraft: false
          prerelease: ${{ env.STABLE != 'true' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
